name: Sniper 3m Telegram

on:
  schedule:
    - cron: "*/5 7-11 * * *"
    - cron: "*/5 13-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sniper3m
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Cycle (fetch + moteur + alertes Telegram)
        env:
          TELEGRAM_BOT_TOKEN_SNIPER: ${{ secrets.TELEGRAM_BOT_TOKEN_SNIPER }}
          TELEGRAM_CHAT_ID_SNIPER: ${{ secrets.TELEGRAM_CHAT_ID_SNIPER }}
        run: python3 bot_sniper_3m.py --once

      - name: Sauvegarde l'état (positions + règle 2 pertes)
        run: |
          git config user.name "sniper3m-bot"
          git config user.email "sniper3m-bot@users.noreply.github.com"
          git add sniper3m_state.json
          if ! git diff --cached --quiet; then
            git commit -m "state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
